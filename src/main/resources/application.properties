spring.application.name=h2-batch-processing
# Enable the console explicitly
spring.h2.console.enabled=true

# Change the path slightly to avoid routing conflicts
spring.h2.console.path=/h2

# Allow the console to run in an HTML frame structure
spring.h2.console.settings.web-allow-others=true

# Fix the database connection
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver